<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>謎とき解答欄</title>
    <style>
      body {
        background: black;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 40px 0;
        min-height: 100vh;
      }
      h1 {
        color: orangered;
        text-align: center;
        margin-bottom: 20px;
      }
      p {
        color: white;
        text-align: center;
        font-size: 1.2rem;
        margin-bottom: 10px;
      }
      input {
        background: #222;
        color: white;
        border: 2px solid orangered;
        padding: 10px 15px;
        font-size: 1rem;
        text-align: center;
        border-radius: 5px;
        outline: none;
        width: 250px;
        margin-bottom: 15px;
      }
      input::placeholder {
        color: #888;
      }
      input:focus {
        border-color: #ff5722;
        box-shadow: 0 0 8px rgba(255, 87, 34, 0.6);
      }
      button {
        background: orangered;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 15px;
        transition: background 0.2s, box-shadow 0.2s;
      }
      button:hover {
        background: #ff5722;
        box-shadow: 0 0 10px rgba(255, 87, 34, 0.8);
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <h1>謎とき解答欄</h1>
    <p>問１</p>
    <input type="text" id="no1" placeholder="答えを入力">
    <p>問２</p>
    <input type="text" id="no2" placeholder="答えを入力">
    <p>問３</p>
    <input type="text" id="no3" placeholder="答えを入力">
    <p>問４</p>
    <input type="text" id="no4" placeholder="答えを入力">
    <button>送信</button>
  </body>
</html>
