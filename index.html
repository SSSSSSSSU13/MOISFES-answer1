<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎とき解答欄</title>
    <style>
      body {
        background: black;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 30px 20px;
        min-height: 100vh;
        box-sizing: border-box;
      }
      h1 {
        color: orangered;
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: 20px;
      }
      p {
        color: white;
        text-align: center;
        font-size: 1.1rem;
        margin-bottom: 8px;
      }
      input, textarea {
        background: #222;
        color: white;
        border: 2px solid orangered;
        padding: 12px 15px;
        font-size: 1rem;
        text-align: center;
        border-radius: 5px;
        outline: none;
        width: 100%;
        max-width: 280px;
        margin-bottom: 15px;
        box-sizing: border-box;
        font-family: sans-serif;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
      }
      input::placeholder, textarea::placeholder {
        color: #888;
      }
      input:focus, textarea:focus {
        border-color: #ff5722;
        box-shadow: 0 0 8px rgba(255, 87, 34, 0.6);
      }
      input:disabled, textarea:disabled {
        border-color: green !important;
        background: #112211 !important;
        color: #88ff88 !important;
        cursor: not-allowed;
        opacity: 1;
      }
      button {
        background: orangered;
        color: white;
        border: none;
        padding: 14px 0;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
        max-width: 280px;
        transition: background 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }
      button:hover {
        background: #ff5722;
        box-shadow: 0 0 10px rgba(255, 87, 34, 0.8);
      }
      button:active {
        transform: scale(0.98);
      }
      #clear-message {
        display: none;
        text-align: center;
        margin-top: 20px;
      }
      #clear-message h2 {
        color: #88ff88;
        font-size: 2rem;
        margin: 0 0 10px 0;
      }
      #clear-message p {
        color: #ccc;
        font-size: 0.9rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>謎とき解答欄</h1>
    <div id="quiz-container">
      <p>問１</p>
      <input type="text" id="no1" placeholder="答えを入力">
      <p>問２<br>（左側から改行、スペースなしで）</p>
      <textarea id="no2" placeholder="答えを入力"></textarea>    
      <p>問３</p>
      <input type="text" id="no3" placeholder="答えを入力">
      <p>問４</p>
      <input type="text" id="no4" placeholder="答えを入力">
      <button>送信</button>
    </div>

    <div id="clear-message">
      <h2>ショッピングモールの謎<br>全問正解！！</h2>
      <p>この写真をteamsで[IshiiHiromu]におくってください</p>
    </div>

    <script>
      let a1 = "世界";
      let a2 = "そにっくしてぃまえしんこくどうきりひきがわさくらぎよんちょうめかみこちょうにしかみこちょうなかなみきなみきこうえんみはしにちょうめ";
      let a3 = "正";
      let a4 = "モイス";

      function submit() {
        let questions = [
          { id: 'no1', ans: a1 },
          { id: 'no2', ans: a2, isTextarea: true },
          { id: 'no3', ans: a3 },
          { id: 'no4', ans: a4 }
        ];

        questions.forEach(q => {
          let elem = document.getElementById(q.id);
          if (elem.disabled) return;

          let val = elem.value;
          if (q.isTextarea) {
            val = val.replace(/\r?\n/g, "");
          }

          if (val === q.ans && q.ans !== "") {
            elem.disabled = true;
          }
        });

        let allCleared = questions.every(q => document.getElementById(q.id).disabled);
        if (allCleared) {
          document.getElementById('quiz-container').style.display = 'none';
          document.getElementById('clear-message').style.display = 'block';
        }
      }

      const submitButton = document.querySelector('button');
      submitButton.addEventListener('click', () => {
        submit();
      });
    </script>
  </body>
</html>
